<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste IPTV</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 80%;
      max-width: 700px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 15px;
      font-size: 16px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #00b894;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    button:hover {
      opacity: 0.9;
    }

    video {
      width: 90%;
      max-width: 1000px;
      border-radius: 15px;
      background: black;
    }
  </style>
</head>
<body>

  <h1>Player IPTV Teste</h1>

  <input 
    type="text" 
    id="m3u8" 
    placeholder="Cole aqui seu link .m3u8"
  >

  <button onclick="carregarVideo()">
    Reproduzir
  </button>

  <video id="video" controls autoplay></video>

  <script>
    function carregarVideo() {

      const video = document.getElementById('video');
      const url = document.getElementById('m3u8').value;

      if (Hls.isSupported()) {

        const hls = new Hls();

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play();
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {

        video.src = url;
        video.addEventListener('loadedmetadata', function () {
          video.play();
        });

      } else {
        alert('Seu navegador não suporta HLS.');
      }
    }
  </script>

</body>
</html>
