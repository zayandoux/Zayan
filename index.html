<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de M3U</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
/* RESET & FONTES */
body {
    margin: 0;
    padding: 0;
    background: #0a0f1a;
    font-family: 'Roboto', sans-serif;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
}

.panel {
    width: 100%;
    max-width: 750px;
    background: #0f1320;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(34, 255, 150, 0.3), 0 0 20px rgba(59, 130, 246, 0.2);
    border: 2px solid #16f09e;
}

.header {
    background: linear-gradient(90deg, #0fffa3, #22c55e);
    color: #0a0f1a;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    padding: 25px;
    text-shadow: 0 0 10px #22c55e;
}

.login {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    padding: 20px 25px;
    justify-content: center;
}

.login input {
    flex: 1 1 200px;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid #22c55e;
    background: #0f1320;
    color: #e0e0e0;
    font-size: 15px;
    transition: 0.3s;
}

.login input:focus {
    outline: none;
    box-shadow: 0 0 10px #22c55e;
    border-color: #22c55e;
}

.login button {
    padding: 14px 20px;
    border-radius: 12px;
    border: none;
    background: #22c55e;
    color: #0a0f1a;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.3s;
    box-shadow: 0 0 10px #22c55e;
}

.login button:hover {
    box-shadow: 0 0 20px #22c55e, 0 0 40px #16f09e;
    transform: translateY(-2px);
}

#resultado {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    padding: 20px 25px 30px 25px;
}

.server {
    background: #0a0f1a;
    border: 2px solid #22c55e;
    border-radius: 15px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(34, 255, 150, 0.4);
}

.server:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px rgba(34, 255, 150, 0.7), 0 0 15px rgba(59, 130, 246, 0.5);
}

.server-name {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #22ff9e;
    margin-bottom: 10px;
    text-shadow: 0 0 8px #22ff9e;
}

.server-link {
    font-size: 12px;
    word-break: break-all;
    color: #c0f9de;
    margin-bottom: 12px;
}

.actions {
    display: flex;
    gap: 8px;
}

.actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    text-transform: uppercase;
    transition: 0.3s;
}

/* BOTÕES NEON */
.copy {
    background: #3b82f6;
    color: #fff;
    box-shadow: 0 0 10px #3b82f6;
}

.copy:hover {
    box-shadow: 0 0 20px #3b82f6, 0 0 30px #2563eb;
}

.copy.copiado {
    background: #22ff9e;
    box-shadow: 0 0 20px #22ff9e;
    color: #0a0f1a;
}

.dns {
    background: #f97316;
    color: #fff;
    box-shadow: 0 0 10px #f97316;
}

.dns:hover {
    box-shadow: 0 0 20px #f97316, 0 0 30px #ea580c;
}

.dns.copiado {
    background: #22ff9e;
    box-shadow: 0 0 20px #22ff9e;
    color: #0a0f1a;
}

.testar {
    width: 36px;
    background: #475569;
    color: #fff;
    font-size: 16px;
    box-shadow: 0 0 10px #475569;
}

.testar:hover {
    box-shadow: 0 0 20px #475569, 0 0 30px #64748b;
}

@media(max-width: 650px){
    #resultado {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="panel">
    <div class="header">Gerador de M3U</div>

    <div class="login">
        <input id="user" placeholder="Usuário">
        <input id="pass" placeholder="Senha">
        <button onclick="gerar()">Gerar Links</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
const servidores = [
{nome:"🛸Galaxy", url:"http://x25.acxll.shop"},
{nome:"🧿Seven", url:"http://sev.ontv.fun"},
{nome:"💣Explosion", url:"http://mainxs.site:80"},
{nome:"🌑Lunar", url:"http://prd.blc-atena.com"},
{nome:"⚡Speed", url:"http://spd.blc-atena.com"},
{nome:"📡Sky", url:"http://atbx.blc-atena.com"},
{nome:"☀️Solar", url:"http://solar.playblc.work"},
{nome:"🪐Urano", url:"http://od.blc-atena.com"},
{nome:"🏛️Atena", url:"http://atn.blc-atena.com"},
{nome:"☄️Andromeda", url:"http://mplay.run"},
{nome:"🌬️Venus", url:"http://ntb.blc-atena.com"},
{nome:"🔥Fire", url:"http://ecps.blc-atena.com"}
];

function gerar(){
let user = document.getElementById("user").value;
let pass = document.getElementById("pass").value;

if(!user || !pass){
alert("Preencha usuário e senha");
return;
}

let resultado = document.getElementById("resultado");
resultado.innerHTML = "";

servidores.forEach((s,i)=>{
let link = `${s.url}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=mpegts`;

let div = document.createElement("div");
div.className = "server";

div.innerHTML = `
<div class="server-name">${s.nome}</div>
<div class="server-link">${link}</div>
<div class="actions">
<button id="m3u${i}" class="copy">Copiar</button>
<button id="dns${i}" class="dns">DNS</button>
<button class="testar" onclick="testar('${s.url}')">↗</button>
</div>
`;

resultado.appendChild(div);

// copiar M3U permanente
document.getElementById(`m3u${i}`).onclick = function(){
navigator.clipboard.writeText(link);
this.innerText = "Copiado";
this.classList.add("copiado");
};

// copiar DNS permanente
document.getElementById(`dns${i}`).onclick = function(){
navigator.clipboard.writeText(s.url);
this.innerText = "Copiado";
this.classList.add("copiado");
};
});
}

function testar(url){
window.open(url, "_blank");
}
</script>

</body>
</html>
