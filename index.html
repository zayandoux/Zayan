<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de M3U</title>

<!-- Fonte moderna -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    background: #0d1117;
    color: #e4e6eb;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 20px;
}

.panel {
    width: 100%;
    max-width: 700px;
    background: #161b22;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    overflow: hidden;
}

.header {
    background: linear-gradient(90deg, #0f766e, #22c55e);
    padding: 25px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
}

.login {
    padding: 20px 25px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
}

.login input {
    flex: 1 1 200px;
    padding: 12px 15px;
    border-radius: 10px;
    border: none;
    background: #1f2937;
    color: #fff;
    font-size: 14px;
}

.login input:focus {
    outline: 2px solid #22c55e;
}

.login button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.login button:hover {
    background: #16a34a;
}

#resultado {
    padding: 20px 25px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.server {
    background: #1b2029;
    padding: 15px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s, box-shadow 0.2s;
}

.server:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.server-name {
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 16px;
}

.server-link {
    font-size: 12px;
    word-break: break-all;
    margin-bottom: 12px;
    color: #cbd5e1;
}

.actions {
    display: flex;
    gap: 8px;
}

.actions button {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    border: none;
    font-weight: 500;
    transition: 0.2s;
}

.copy {
    background: #3b82f6;
    color: #fff;
}

.copy:hover {
    background: #2563eb;
}

.copy.copiado {
    background: #22c55e;
}

.dns {
    background: #f97316;
    color: #fff;
}

.dns:hover {
    background: #ea580c;
}

.testar {
    width: 36px;
    background: #475569;
    color: #fff;
    font-size: 16px;
}

.testar:hover {
    background: #64748b;
}

@media(max-width: 600px){
    #resultado {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="panel">
    <div class="header">Painel M3U</div>

    <div class="login">
        <input id="user" placeholder="Usuário">
        <input id="pass" placeholder="Senha">
        <button onclick="gerar()">Gerar Links</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
const servidores = [
{nome:"Galaxy", url:"http://x25.acxll.shop"},
{nome:"Seven", url:"http://sev.ontv.fun"},
{nome:"Explosion", url:"http://mainxs.site:80"},
{nome:"Lunar", url:"http://prd.blc-atena.com"},
{nome:"Speed", url:"http://spd.blc-atena.com"},
{nome:"Sky", url:"http://atbx.blc-atena.com"},
{nome:"Solar", url:"http://solar.playblc.work"},
{nome:"Urano", url:"http://od.blc-atena.com"},
{nome:"Atena", url:"http://atn.blc-atena.com"},
{nome:"Andromeda", url:"http://mplay.run"},
{nome:"Venus", url:"http://ntb.blc-atena.com"},
{nome:"Fire", url:"http://ecps.blc-atena.com"}
];

function gerar(){
let user = document.getElementById("user").value;
let pass = document.getElementById("pass").value;

if(!user || !pass){
alert("Preencha usuário e senha");
return;
}

let resultado = document.getElementById("resultado");
resultado.innerHTML = "";

servidores.forEach((s,i)=>{
let link = `${s.url}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=mpegts`;

let div = document.createElement("div");
div.className = "server";

div.innerHTML = `
<div class="server-name">${s.nome}</div>
<div class="server-link">${link}</div>
<div class="actions">
<button id="m3u${i}" class="copy">Copiar</button>
<button id="dns${i}" class="dns">DNS</button>
<button class="testar" onclick="testar('${s.url}')">↗</button>
</div>
`;

resultado.appendChild(div);

// copiar M3U
document.getElementById(`m3u${i}`).onclick = function(){
navigator.clipboard.writeText(link);
this.innerText = "Copiado";
this.classList.add("copiado");
setTimeout(()=>{
this.innerText = "Copiar";
this.classList.remove("copiado");
},2000);
};

// copiar DNS
document.getElementById(`dns${i}`).onclick = function(){
navigator.clipboard.writeText(s.url);
this.innerText = "Copiado";
this.classList.add("copiado");
setTimeout(()=>{
this.innerText = "DNS";
this.classList.remove("copiado");
},2000);
};
});
}

function testar(url){
window.open(url, "_blank");
}
</script>

</body>
</html>
