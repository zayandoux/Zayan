<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IPTV Local</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
}

header{
  padding:15px;
  background:#1c1c1c;
}

input{
  padding:10px;
}

.container{
  display:flex;
  height:90vh;
}

.sidebar{
  width:250px;
  overflow:auto;
  background:#181818;
}

.category{
  padding:15px;
  border-bottom:1px solid #222;
  cursor:pointer;
}

.category:hover{
  background:#222;
}

.content{
  flex:1;
  display:flex;
  flex-direction:column;
}

video{
  width:100%;
  height:45%;
  background:black;
}

.channels{
  flex:1;
  overflow:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:10px;
  padding:10px;
}

.card{
  background:#1f1f1f;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card-title{
  padding:10px;
}

</style>
</head>
<body>

<header>

<input type="file" id="fileInput">

</header>

<div class="container">

<div class="sidebar" id="categories"></div>

<div class="content">

<video id="video" controls autoplay></video>

<div class="channels" id="channels"></div>

</div>

</div>

<script>

let grouped = {};

document
.getElementById("fileInput")
.addEventListener("change", function(e){

  const file = e.target.files[0];

  const reader = new FileReader();

  reader.onload = function(event){

    parseM3U(event.target.result);

  };

  reader.readAsText(file);

});

function parseM3U(data){

  grouped = {};

  const lines = data.split('\n');

  let current = {};

  lines.forEach(line => {

    line = line.trim();

    if(line.startsWith("#EXTINF")){

      const title = line.split(',').pop();

      const logoMatch = line.match(/tvg-logo="(.*?)"/);

      const groupMatch = line.match(/group-title="(.*?)"/);

      current = {
        title:title,
        logo:logoMatch ? logoMatch[1] : '',
        category:groupMatch ? groupMatch[1] : 'Outros'
      };

    }

    else if(line.startsWith("http")){

      current.url = line;

      if(!grouped[current.category]){
        grouped[current.category] = [];
      }

      grouped[current.category].push({...current});

    }

  });

  renderCategories();

}

function renderCategories(){

  const categories = document.getElementById("categories");

  categories.innerHTML = "";

  Object.keys(grouped).forEach(category => {

    const div = document.createElement("div");

    div.className = "category";

    div.innerText = category;

    div.onclick = () => renderChannels(category);

    categories.appendChild(div);

  });

}

function renderChannels(category){

  const channels = document.getElementById("channels");

  channels.innerHTML = "";

  grouped[category].forEach(item => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <img src="${item.logo || 'https://via.placeholder.com/300x120'}">
      <div class="card-title">${item.title}</div>
    `;

    card.onclick = () => playVideo(item.url);

    channels.appendChild(card);

  });

}

function playVideo(url){

  const video = document.getElementById("video");

  if(Hls.isSupported()){

    const hls = new Hls();

    hls.loadSource(url);

    hls.attachMedia(video);

  }

  else{

    video.src = url;

  }

}

</script>

</body>
</html>
